<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Eclipse SMP</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      padding: 60px 20px;

      display: flex;
      flex-direction: column;
      align-items: center;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: #ffffff;
      text-align: center;

      background:
        linear-gradient(
          rgba(15, 12, 29, 0.52),
          rgba(15, 12, 29, 0.75)
        ),
        url(
          "https://www.nasa.gov/wp-content/uploads/2026/07/eclipse-coverage-advisory-july-29.jpg"
        )
        center / cover no-repeat fixed;
    }

    .header {
      margin-top: 20px;
    }

    .header h2 {
      font-family: "Cinzel", serif;
      font-size: 1.8rem;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero {
      margin: 40px 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
    }

    .hero h1 {
      font-family: "Cinzel", serif;
      font-size: 3.2rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 2px;

      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.2),
        0 0 30px rgba(158, 86, 255, 0.4);
    }

    .hero-tagline {
      max-width: 650px;

      font-size: 1.2rem;
      line-height: 1.7;

      color: rgba(255, 255, 255, 0.9);
    }

    .button-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .main-btn {
      display: inline-block;

      min-width: 220px;
      padding: 16px 34px;

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 1.2rem;
      font-weight: 600;

      cursor: pointer;
      text-decoration: none;

      transition:
        background-color 0.3s,
        color 0.3s,
        transform 0.3s,
        border-color 0.3s,
        box-shadow 0.3s;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .subscribe-btn {
      color: #000000;
      background-color: #ffffff;
      border: 2px solid #ffffff;
    }

    .subscribe-btn:hover {
      background-color: #f0f0f0;
      transform: translateY(-3px);

      box-shadow:
        0 8px 24px rgba(255, 255, 255, 0.22);
    }

    .trailer-btn {
      color: #ffffff;

      background-color:
        rgba(15, 12, 29, 0.45);

      border:
        2px solid rgba(255, 255, 255, 0.75);

      backdrop-filter: blur(8px);
    }

    .trailer-btn:hover {
      background-color:
        rgba(255, 255, 255, 0.15);

      border-color: #ffffff;
      transform: translateY(-3px);
    }

    .play-icon {
      display: inline-block;
      margin-right: 8px;
    }

    .section-card {
      width: 100%;
      max-width: 900px;

      margin: 20px 0;
      padding: 32px 24px;

      background:
        rgba(15, 12, 29, 0.52);

      border:
        1px solid rgba(255, 255, 255, 0.28);

      backdrop-filter: blur(10px);

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.3);
    }
