      letter-spacing: 1px;

      background: rgba(255, 255, 255, 0.12);

      justify-content: center;

      text-decoration: none;

      transition:
        background 0.3s,
        border-color 0.3s,
        transform 0.3s;
    }

    .social-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;

    }

    @media (max-width: 600px) {
