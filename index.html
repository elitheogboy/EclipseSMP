<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse SMP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container */
    .container {
      max-width: 500px;
      width: 100%;
    }

    /* Server Logo / Header Image Placeholders */
    .logo-glow {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      background: radial-gradient(circle, #00d2ff 0%, #3a7bd5 100%);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
    }

    /* Server Title */
    h1 {
      font-size: 2.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    /* Subtitle / Description */
    .description {
      color: #8b9bb4;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    /* Server IP Box */
    .ip-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 1.1rem;
      color: #00d2ff;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* Buttons Stack */
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, filter 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* Custom Button Colors */
    .btn-discord {
      background-color: #5865F2;
      color: white;
    }

    .btn-store {
      background-color: #00d2ff;
      color: #0b0f19;
    }

    .btn-vote {
      background-color: #2b384e;
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-glow">🌙</div>

    <h1>Eclipse SMP</h1>
    <p class="description">The ultimate survival experience. Join our community today!</p>

    <div class="ip-box">play.eclipsesmp.com</div>

    <div class="btn-stack">
      <a href="https://discord.gg/yourserver" class="btn btn-discord" target="_blank">Join Discord</a>
      <a href="https://yourstore.tebex.io" class="btn btn-store" target="_blank">Server Store</a>
      <a href="#" class="btn btn-vote">Vote for Us</a>
    </div>
  </div>

</body>
</html>
